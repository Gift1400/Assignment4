<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="../style/Jumper-game.css">
  <title>2d Game - Jump the Cactus!</title>
</head>
<body>
  <video autoplay muted loop playsinline id="background-video">
      <source src="../background/background.mp4" type="video/mp4" />
      </video>
  <div class="wrapper">
    <h1>Jump the cactus</h1>
    <p>Click <strong>Space</strong> or <strong>Up</strong> to jump .</p>

    <div class="hud">
      <div id="score">Score: 0</div>
      <div id="status">Status: Playing</div>
    </div>

    <canvas id="gameCanvas" width="800" height="300"></canvas>
    <button id="actionBtn">Start</button>
  </div>

  <script src="../script/Jumper.js"> </script>
</body>
</html>
